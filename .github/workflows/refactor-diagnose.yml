name: Refactor Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-python311:
    name: Diagnose Python 3.11 tests
    if: github.ref_name == 'refactor-media-source-model'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: just ci-install 3.11

      - name: Run diagnostic tests
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: '1'
        run: >-
          uv run -p 3.11 pytest -vv --tb=short
          -m '(api or processor or biliass) and not (ci_skip or ignore)'
          --reruns 0

  ruff-safe-fix:
    name: Apply safe Ruff fixes
    if: github.ref_name == 'refactor-media-source-model'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor-media-source-model

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: just ci-install 3.11

      - name: Apply safe Ruff fixes
        run: |
          uv run ruff check . --fix
          uv run ruff format .

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No safe Ruff fixes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '🧹 style: apply safe Ruff fixes'
          git push origin HEAD:refactor-media-source-model
