name: Refactor Full CodSpeed Preflight

on:
  push:
    branches:
      - benchmark/refactor-full-codspeed
  workflow_dispatch:

jobs:
  compare:
    name: upstream-standard CodSpeed preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
          allow-prereleases: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare wheel cache identity
        id: wheels
        run: python scripts/prepare-ci-cache.py

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ""
          cache-suffix: ci-wheels-${{ steps.wheels.outputs.cache-key }}
          prune-cache: true

      - name: Cache native build dependencies
        if: steps.uv.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            packages/biliass/rust
          shared-key: native-3.14-${{ steps.python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
          env-vars: ImageOS PYO3 PYTHON MATURIN UV YUTTO_CI_BUILD_ENV_KEY
          cache-bin: false

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install candidate dependencies
        run: just ci-install 3.14

      - name: Run candidate exactly like upstream CodSpeed job
        id: candidate-codspeed
        continue-on-error: true
        uses: CodSpeedHQ/action@v5
        env:
          YUTTO_VARIANT: candidate
        with:
          mode: simulation
          run: uv run -p 3.14 pytest --codspeed

      # A fork cannot upload to upstream's CodSpeed project, so the action ends
      # with 401 after benchmark execution. Keep going to the local A/B phase.
      # The baseline stays out of the candidate checkout until candidate pytest
      # has finished, avoiding recursive discovery of a second tests/ tree.
      - name: Checkout upstream main
        if: ${{ always() }}
        uses: actions/checkout@v7
        with:
          repository: yutto-dev/yutto
          ref: main
          path: baseline
          submodules: recursive

      - name: Install baseline dependencies
        if: ${{ always() }}
        working-directory: baseline
        run: just ci-install 3.14

      - name: Run the same benchmark corpus on upstream main
        id: baseline-codspeed
        if: ${{ always() }}
        continue-on-error: true
        uses: CodSpeedHQ/action@v5
        env:
          YUTTO_VARIANT: baseline
        with:
          mode: simulation
          run: baseline/.venv/bin/python -m pytest benchmarks/test_refactor_codspeed.py --codspeed -q

      - name: Compare wall time on the same runner (3 paired runs)
        if: ${{ always() }}
        run: |
          # Alternate execution order to reduce warm-cache / runner-drift bias.
          YUTTO_VARIANT=baseline \
            baseline/.venv/bin/python benchmarks/test_refactor_codspeed.py > /tmp/baseline-1.json
          YUTTO_VARIANT=candidate \
            .venv/bin/python benchmarks/test_refactor_codspeed.py > /tmp/candidate-1.json

          YUTTO_VARIANT=candidate \
            .venv/bin/python benchmarks/test_refactor_codspeed.py > /tmp/candidate-2.json
          YUTTO_VARIANT=baseline \
            baseline/.venv/bin/python benchmarks/test_refactor_codspeed.py > /tmp/baseline-2.json

          YUTTO_VARIANT=baseline \
            baseline/.venv/bin/python benchmarks/test_refactor_codspeed.py > /tmp/baseline-3.json
          YUTTO_VARIANT=candidate \
            .venv/bin/python benchmarks/test_refactor_codspeed.py > /tmp/candidate-3.json

          python - <<'PY'
          import json
          from pathlib import Path
          from statistics import fmean

          labels = {
              "selection": "Legacy selection corpus",
              "routing_non_batch": "Non-batch routing corpus",
              "routing_batch": "Batch routing corpus",
              "cli": "CLI parsing corpus",
              "request_validation": "DownloadRequest validation corpus",
          }

          baseline_runs = [
              json.loads(Path(f"/tmp/baseline-{i}.json").read_text())
              for i in range(1, 4)
          ]
          candidate_runs = [
              json.loads(Path(f"/tmp/candidate-{i}.json").read_text())
              for i in range(1, 4)
          ]

          lines = [
              "| Benchmark | upstream main avg | refactor avg | delta |",
              "| --- | ---: | ---: | ---: |",
          ]
          details = [
              "",
              "<details><summary>Per-run values</summary>",
              "",
              "| Benchmark | main #1 | main #2 | main #3 | refactor #1 | refactor #2 | refactor #3 |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]

          for key, label in labels.items():
              old_values = [run[key] / 1_000 for run in baseline_runs]
              new_values = [run[key] / 1_000 for run in candidate_runs]
              old = fmean(old_values)
              new = fmean(new_values)
              delta = (new / old - 1) * 100
              lines.append(
                  f"| {label} | {old:.3f} µs/op | {new:.3f} µs/op | {delta:+.1f}% |"
              )
              details.append(
                  f"| {label} | "
                  + " | ".join(f"{value:.3f}" for value in (*old_values, *new_values))
                  + " |"
              )

          details.extend(["", "</details>"])
          report = "\n".join([*lines, *details])
          print(report)
          Path("/tmp/perf-summary.md").write_text(report + "\n")
          PY
          cat /tmp/perf-summary.md >> "$GITHUB_STEP_SUMMARY"
